# Fonts and shape are fixed here. Colors below are the default theme
# ("Midnight"); ui/theme.py re-points them at runtime when another theme is
# chosen in Settings, so keep these values in sync with THEMES["midnight"].
[theme]
base = "dark"
primaryColor = "#2672CE"
backgroundColor = "#0E1217"
secondaryBackgroundColor = "#1B212A"
textColor = "#E8EBF0"
linkColor = "#6DA7EC"
borderColor = "#303947"
showWidgetBorder = true
baseRadius = "8px"
buttonRadius = "8px"
baseFontSize = 15
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFontWeights = [700, 700, 600, 600, 600, 600]

[theme.sidebar]
backgroundColor = "#0B0E13"
secondaryBackgroundColor = "#1B212A"
borderColor = "#232A34"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
